    renderAll(); selectNode(n.id); scheduleSave();
  });
  panelBody.querySelectorAll("[data-openurl]").forEach(el=> el.onclick = ()=> window.open(el.dataset.openurl, "_blank", "noopener,noreferrer"));
  panelBody.querySelectorAll("[data-gotolinkval]").forEach(el=> el.onclick = ()=>{
    const resolved = resolveLink(el.dataset.gotolinkval); if(!resolved) return;
    const crossBoard = resolved.board.id !== state.activeBoardId;
    if(crossBoard) switchBoard(resolved.board.id);
    selectNode(resolved.node.id); centerOn(resolved.node.id, Math.max(activeBoard().camera.zoom,0.9));
  });
  document.getElementById("fScore").onchange = (e)=>{ pushHistory(); const v=parseInt(e.target.value); n.score = isNaN(v)?null:Math.max(1,Math.min(10,v)); renderAll(); scheduleSave(); };
  document.getElementById("fDesired").onchange = (e)=>{ pushHistory(); const v=parseInt(e.target.value); n.desiredScore = isNaN(v)?null:Math.max(1,Math.min(10,v)); renderAll(); scheduleSave(); };
  const st = document.getElementById("fStatus"); if(st) st.onchange = (e)=>{ pushHistory(); n.status=e.target.value; renderAll(); scheduleSave(); };
  panelBody.querySelectorAll(".swatch").forEach(s=> s.onclick = ()=>{ pushHistory(); n.color = s.dataset.color; renderAll(); selectNode(n.id); scheduleSave(); });
  document.getElementById("bAddChild").onclick = ()=> addChildTo(n.id);
  document.getElementById("bAddSibling").onclick = ()=> addSiblingOf(n.id);
  const bd = document.getElementById("bDetach"); if(bd) bd.onclick = ()=>{ pushHistory(); detachNode(n.id); renderAll(); scheduleSave(); toast("Detached — now an independent card"); };
  const bi = document.getElementById("bImprove"); if(bi) bi.onclick = ()=> openImproveForm(n.id);
  panelBody.querySelectorAll("[data-backlink]").forEach(el=> el.onclick = ()=>{
    const resolved = resolveLink(el.dataset.backlink); if(!resolved) return;
    const crossBoard = resolved.board.id !== state.activeBoardId;
    if(crossBoard) switchBoard(resolved.board.id);
    selectNode(resolved.node.id); centerOn(resolved.node.id, Math.max(activeBoard().camera.zoom,0.9));
  });
  const del = document.getElementById("bDelete"); if(del) del.onclick = confirmDeleteSelected;
}
function linksListHtml(n){
  const links = n.links || [];
  if(!links.length) return `<div class="hint" style="margin:2px 0 6px;">No links yet.</div>`;
  return links.map(l=>{
    if(l.type==="url"){
      return `<div class="listitem"><span class="name" data-openurl="${escapeHtml(l.value)}">🔗 ${escapeHtml(displayUrl(l.value))}</span><button class="btn small danger" data-removelink="${l.id}">✕</button></div>`;
    }
    const resolved = resolveLink(l.value);
    if(!resolved) return `<div class="listitem"><span class="name" style="color:var(--text-faint)">(broken link)</span><button class="btn small danger" data-removelink="${l.id}">✕</button></div>`;
    const crossBoard = resolved.board.id !== state.activeBoardId;
    return `<div class="listitem"><span class="name" data-gotolinkval="${l.value}">${crossBoard?"⤴ ":"↦ "}${escapeHtml(resolved.node.text)}${crossBoard?" · "+escapeHtml(resolved.board.name):""}</span><button class="btn small danger" data-removelink="${l.id}">✕</button></div>`;
  }).join("");
}
function backlinksHtml(id){
  const hits = getBacklinks(state.activeBoardId, id);
  if(!hits.length) return "";
  const items = hits.map(h=>{
    const crossBoard = h.board.id !== state.activeBoardId;
    return `<div class="listitem"><span class="name" data-backlink="${h.board.id}::${h.node.id}">${crossBoard?"⤺ ":"⬅ "}${escapeHtml(h.node.text)}${crossBoard?" · "+escapeHtml(h.board.name):""}</span></div>`;
  }).join("");
  return `<div class="divider"></div><div class="sectiontitle">Linked from</div>${items}`;
}
function escapeHtml(s){ return (s||"").replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function displayUrl(url){
  try{ const u = new URL(url); return (u.hostname.replace(/^www\./,"") + u.pathname).replace(/\/$/,"").slice(0,28); }
  catch(e){ return url.slice(0,28); }
}
function normalizeLink(v){
  v = (v||"").trim();
  if(!v) return null;
  if(!/^https?:\/\//i.test(v)) v = "https://" + v;
  return v;
}
function focusLinkField(){
  openPanel("details");
  setTimeout(()=>{
    const f = document.getElementById("fNewLink");
    if(f){ f.scrollIntoView({block:"center"}); f.focus(); }
  }, 60);
}

/* ---------- IMPROVE THIS flow ---------- */
function openImproveForm(sourceId){
  const n = getNode(sourceId);
  panelTitle.textContent = "Improve this";
  panelEl.classList.add("open");
  document.querySelectorAll(".ptab").forEach(t=>t.classList.remove("active"));
  panelBody.innerHTML = `
    <div class="field hint" style="margin-bottom:14px;">Turning <b>${escapeHtml(n.text)}</b> into a small, testable improvement loop.</div>
    <div class="field"><label>What usually triggers it?</label><textarea id="iTrigger"></textarea></div>
    <div class="field"><label>What do I currently do?</label><textarea id="iCurrent"></textarea></div>
    <div class="field"><label>What would I like to do instead?</label><textarea id="iNew"></textarea></div>
    <div class="row2">
      <div class="field"><label>One small practice</label><input type="text" id="iPractice" placeholder="e.g. a 15-minute decision window"></div>
      <div class="field"><label>How often?</label><input type="text" id="iFreq" placeholder="e.g. daily"></div>
    </div>
    <div class="field"><label>How will I measure it?</label><input type="text" id="iMeasure" placeholder="e.g. decisions made on time"></div>
    <div class="btnrow">
      <button class="btn primary" id="iSave">Create improvement cards</button>
      <button class="btn" id="iCancel">Cancel</button>
    </div>
  `;
  document.getElementById("iCancel").onclick = ()=>{ openPanel("details"); };
  document.getElementById("iSave").onclick = ()=>{
    const trigger = document.getElementById("iTrigger").value.trim();
    const current = document.getElementById("iCurrent").value.trim();
    const nw = document.getElementById("iNew").value.trim();
    const practice = document.getElementById("iPractice").value.trim();
    const freq = document.getElementById("iFreq").value.trim();
    const measure = document.getElementById("iMeasure").value.trim();
    pushHistory();
    let chain = sourceId;
    const steps = [
      trigger && ["Trigger: " + trigger, ""],
      current && ["Current response: " + current, ""],
      nw && ["New response: " + nw, ""],
      practice && ["Practice" + (freq?(" ("+freq+")"):""), practice],
      measure && ["Measurement", measure]
    ].filter(Boolean);
    if(!steps.length) steps.push(["Improvement task", ""]);
    steps.forEach(([title, desc])=>{
      const node = createNode(chain, title, {type:"improvement", color:"teal", description:desc, status:"active"});
      chain = node.id;
    });
    renderAll(); scheduleSave();
    toast("Improvement loop added");
    openPanel("details"); selectNode(sourceId);
  };
}

/* ---------- DASHBOARD TAB ---------- */
function renderDashboardTab(){
  panelTitle.textContent = "Dashboard";
  const dims = state.dimensions.map(d=>`
    <div class="dim-row">
      <div class="dim-label"><b>${escapeHtml(d.name)}</b><span>${d.current}/10 → ${d.desired}/10</span></div>
      <div class="dim-bar"><div class="fill" style="width:${d.current*10}%"></div><div class="target" style="left:${d.desired*10}%"></div></div>
      <input type="range" min="1" max="10" value="${d.current}" data-dim="${d.id}" data-field="current">
    </div>`).join("");

  const strengths = branchChildren("Strengths");
  const blindspots = branchChildren("Blind Spots");
  const improvements = nodesArr().filter(n=>n.type==="improvement" && !n.parentIsImprovement);
  const topLevelImprovements = nodesArr().filter(n=> n.type==="improvement" && (!getNode(n.parentId) || getNode(n.parentId).type!=="improvement"));

  panelBody.innerHTML = `
    <div class="sectiontitle">Self-assessment dimensions</div>
    <div class="field hint" style="margin-top:-6px;margin-bottom:12px;">Reflective scores you set yourself — not a diagnosis.</div>
    ${dims}
    <div class="divider"></div>
    <div class="sectiontitle">Strengths</div>
    ${listOrEmpty(strengths,"No strengths recorded yet.")}
    <div class="divider"></div>
    <div class="sectiontitle">Blind spots / development areas</div>
    ${listOrEmpty(blindspots,"No blind spots recorded yet.")}
    <div class="divider"></div>
    <div class="sectiontitle">Active improvement tasks</div>
    ${topLevelImprovements.length ? topLevelImprovements.map(t=>`
      <div class="listitem"><span class="name" data-goto="${t.id}">${escapeHtml(t.text)}</span>
      <span class="tagchip" style="background:${cssColor(t.color)}">${t.status||'active'}</span></div>`).join("")
      : `<div class="empty-state">No improvement tasks yet. Select a card and choose "Improve this".</div>`}
  `;
  panelBody.querySelectorAll('input[type=range]').forEach(r=> r.oninput = (e)=>{
    const d = state.dimensions.find(d=>d.id===e.target.dataset.dim);
    d.current = parseInt(e.target.value); scheduleSave(); renderDashboardTab();
  });
  panelBody.querySelectorAll('[data-goto]').forEach(el=> el.onclick = ()=>{
    const id = el.dataset.goto; selectNode(id); centerOn(id, Math.max(activeBoard().camera.zoom,0.9)); openPanel("details");
  });
}
function branchChildren(branchName){
  const b = nodesArr().find(n=>n.type==="branch" && n.text===branchName);
  if(!b) return [];
  return children(b.id);
}
function listOrEmpty(items, emptyMsg){
  if(!items.length) return `<div class="empty-state">${emptyMsg}</div>`;
  return items.map(i=>`<div class="listitem"><span class="name" data-goto="${i.id}">${escapeHtml(i.text)}</span></div>`).join("");
}

/* ---------- REVIEW TAB ---------- */
const REVIEW_QS = [
  "What did I do well this week?",
  "What pattern did I notice?",
  "What caused difficulty?",
  "What did I learn?",
  "Which habit improved?",
  "What should I stop doing?",
  "What should I continue?",
  "What is my one priority for next week?"
];
function renderReviewTab(){
  panelTitle.textContent = "Weekly review";
  const qs = REVIEW_QS.map((q,i)=>`<div class="reviewq"><label>${q}</label><textarea data-q="${i}" rows="2"></textarea></div>`).join("");
  const past = state.reviews.slice().reverse().map(r=>`
    <div class="pastreview"><div class="date">${r.date}</div>
    ${r.answers.map((a,i)=> a? `<div><i>${REVIEW_QS[i]}</i><br>${escapeHtml(a)}</div>`:"").join("")}</div>`).join("");
  panelBody.innerHTML = `
    ${qs}
    <div class="btnrow"><button class="btn primary" id="rSave">Save this week's review</button></div>
    <div class="divider"></div>
    <div class="sectiontitle">Past reviews</div>
    ${past || `<div class="empty-state">No reviews saved yet.</div>`}
  `;
  document.getElementById("rSave").onclick = ()=>{
    const answers = Array.from(panelBody.querySelectorAll('textarea[data-q]')).map(t=>t.value.trim());
    if(answers.every(a=>!a)) return toast("Write at least one answer first");
    pushHistory();
    state.reviews.push({id:uid(), date:new Date().toISOString().slice(0,10), answers});
    scheduleSave(); toast("Review saved"); renderReviewTab();
  };
}

/* ---------- SEARCH TAB ---------- */
function renderSearchTab(){
  panelTitle.textContent = "Search & filter";
  panelBody.innerHTML = `
    <div class="field"><input type="text" id="sInput" placeholder="Search titles, notes, categories..."></div>
    <div class="sectiontitle" style="margin-top:14px;">Filter by category</div>
    <div class="filterchips" id="fchips"></div>
    <div id="sResults"></div>
  `;
  const chipWrap = document.getElementById("fchips");
  COLORS.forEach(c=>{
    const chip = document.createElement("div");
    chip.className = "fchip" + (activeFilter===c.key ? " active":"");
    chip.style.color = cssColor(c.key);
    chip.textContent = c.label;
    chip.onclick = ()=>{ activeFilter = activeFilter===c.key ? null : c.key; applyFilter(); renderSearchTab(); };
    chipWrap.appendChild(chip);
  });
  const input = document.getElementById("sInput");
  input.oninput = ()=> runSearch(input.value);
  input.focus();
}
function runSearch(q){
  const results = document.getElementById("sResults");
  q = q.trim().toLowerCase();
  if(!q){ results.innerHTML=""; return; }
  const hits = nodesArr().filter(n=> n.text.toLowerCase().includes(q) || (n.description||"").toLowerCase().includes(q));
  results.innerHTML = hits.length ? hits.map(h=>`
    <div class="searchhit" data-id="${h.id}"><div class="t">${escapeHtml(h.text)}</div>
    ${h.description?`<div class="d">${escapeHtml(h.description)}</div>`:""}</div>`).join("")
    : `<div class="empty-state">No cards match "${escapeHtml(q)}".</div>`;
  results.querySelectorAll(".searchhit").forEach(el=> el.onclick = ()=>{
    const id = el.dataset.id; selectNode(id); centerOn(id, 1); openPanel("details");
  });
}

/* ============================================================
   BOARDS — multiple mind-map pages, switchable from the toolbar
   ============================================================ */
function renderBoardsLabel(){
  const el = document.getElementById("btnBoards");
  if(el && el.tagName !== "INPUT") el.textContent = activeBoard().name + "  ⌄";
}
function switchBoard(id){
  if(id===state.activeBoardId) return;
  state.activeBoardId = id;
  selectedId = null;
  multiSelected.clear(); renderSelectionBar(); // selection is per-board; the clipboard is not affected
  centerViewportIfNeeded();
  renderAll(); renderBoardsLabel(); scheduleSave();
  toast("Switched to \u201c" + activeBoard().name + "\u201d");
}
function createBoardFlow(){
  pushHistory();
  const num = state.boards.length + 1;
  const name = num>1 ? "New board " + num : "New board";
  const central = { id: uid(), text: name.toUpperCase(), description:"", type:"central", x:0, y:0, parentId:null,
    color:"indigo", score:null, desiredScore:null, status:null, links:[],
    createdAt:Date.now(), updatedAt:Date.now(), example:false };
  const board = { id: uid(), name, nodes:[central], camera:{zoom:1,panX:0,panY:0} };
  state.boards.push(board);
  state.activeBoardId = board.id;
  selectedId = null;
  centerViewportIfNeeded();
  renderAll(); renderBoardsLabel(); scheduleSave();
  toast("New board created");
  startBoardRename();
}
function startBoardRename(){
  const wrap = document.getElementById("btnBoards");
  const board = activeBoard();
  wrap.textContent = "";
  const input = document.createElement("input");
  input.type = "text"; input.value = board.name; input.className = "board-rename-input";
  wrap.appendChild(input);
  input.focus(); input.select();
  let done = false;
  function finish(save){
    if(done) return; done = true;
    if(save){ const v = input.value.trim(); if(v) board.name = v; scheduleSave(); }
    renderBoardsLabel();
  }
  input.addEventListener("pointerdown", e=> e.stopPropagation());
  input.addEventListener("click", e=> e.stopPropagation());
  input.addEventListener("keydown", e=>{
    e.stopPropagation();
    if(e.key==="Enter"){ e.preventDefault(); finish(true); }
    else if(e.key==="Escape"){ e.preventDefault(); finish(false); }
  });
  input.addEventListener("blur", ()=> finish(true));
}
function confirmDeleteBoardFlow(){
  if(state.boards.length<=1) return toast("You need at least one board");
  const board = activeBoard();
  ctxMenu.innerHTML = "";
  ctxMenu.appendChild(ctxLabel('Delete "' + board.name + '"? This removes all its cards.'));
  ctxMenu.appendChild(ctxSep());
  ctxMenu.appendChild(ctxItem("🗑","Yes, delete this board", ()=>{
    pushHistory();
    const idx = state.boards.findIndex(b=>b.id===state.activeBoardId);
    state.boards.splice(idx,1);
    state.activeBoardId = state.boards[Math.max(0, idx-1)].id;
    selectedId = null; centerViewportIfNeeded();
    renderAll(); renderBoardsLabel(); scheduleSave(); toast("Board deleted");
  }, true));
  ctxMenu.appendChild(ctxItem("←","Cancel", hideContextMenu));
  ctxMenu.classList.remove("hidden");
}
function openBoardsMenu(anchorEl){
  const r = anchorEl.getBoundingClientRect();
  ctxMenu.innerHTML = "";
  state.boards.forEach(b=>{
    ctxMenu.appendChild(ctxItem(b.id===state.activeBoardId ? "●" : "○", b.name, ()=> switchBoard(b.id)));
  });
  ctxMenu.appendChild(ctxSep());
  ctxMenu.appendChild(ctxItem("＋","New board", createBoardFlow));
  ctxMenu.appendChild(ctxItem("✎","Rename this board", startBoardRename));
  if(state.boards.length>1) ctxMenu.appendChild(ctxItem("🗑","Delete this board", confirmDeleteBoardFlow, true));
  placeContextMenu(r.left, r.bottom+6);
}
document.getElementById("btnBoards").onclick = (e)=>{
  e.stopPropagation();
  openBoardsMenu(e.currentTarget);
};

/* ============================================================
   THEME / MORE MENU / EXPORT-IMPORT WIRING
   ============================================================ */
function applyTheme(){ document.documentElement.setAttribute("data-theme", state.settings.theme); }
function applyStyle(){ document.documentElement.setAttribute("data-style", state.settings.style || "sketch"); }
document.getElementById("btnTheme").onclick = ()=>{
  state.settings.theme = state.settings.theme==="dark" ? "light" : "dark";
  applyTheme(); renderAll(); scheduleSave();
};
const STYLE_OPTIONS = [
  {key:"classic", label:"Classic", desc:"Clean, quiet, serif"},
  {key:"sketch",  label:"Sketch",  desc:"Hand-drawn notebook"},
  {key:"bold",    label:"Bold Idea", desc:"Vivid poster style"}
];
function setStyle(key){
  state.settings.style = key;
  applyStyle(); renderAll(); scheduleSave();
  toast(STYLE_OPTIONS.find(s=>s.key===key).label + " style");
}
document.getElementById("btnStyle").onclick = (e)=>{
  e.stopPropagation();
  const r = e.currentTarget.getBoundingClientRect();
  ctxMenu.innerHTML = "";
  STYLE_OPTIONS.forEach(opt=>{
    const active = (state.settings.style||"sketch")===opt.key;
    ctxMenu.appendChild(ctxItem(active?"●":"○", opt.label + " — " + opt.desc, ()=> setStyle(opt.key)));
  });
  placeContextMenu(r.left, r.bottom+6);
};

document.getElementById("btnAuth").onclick = (e)=>{
  e.stopPropagation();
  const r = e.currentTarget.getBoundingClientRect();
  ctxMenu.innerHTML = "";
  if(!supa){
    ctxMenu.appendChild(ctxLabel("Cloud sync isn't set up yet — add your Supabase URL and anon key near the top of the code (see the setup guide), then redeploy."));
    placeContextMenu(r.left, r.bottom+6);
    return;
  }
  if(cloudUser){
    ctxMenu.appendChild(ctxLabel("Signed in as " + cloudUser.email));
    ctxMenu.appendChild(ctxSep());
    ctxMenu.appendChild(ctxItem("⟳","Sync now", pushCloud));
    ctxMenu.appendChild(ctxItem("↪","Sign out (this device only)", async ()=>{
      await supa.auth.signOut(); cloudUser=null; renderAuthLabel();
      toast("Signed out — this device now saves locally only");
    }));
    placeContextMenu(r.left, r.bottom+6);
    return;
  }
  const wrap = document.createElement("div"); wrap.style.padding = "8px 8px 6px"; wrap.style.width="220px";
  wrap.innerHTML = `<div class="field hint" style="margin-bottom:8px;">We'll email you a one-click sign-in link — no password needed.</div>`;
  const input = document.createElement("input");
  input.type = "email"; input.placeholder = "you@example.com"; input.className = "ctx-search";
  wrap.appendChild(input);
  const btn = document.createElement("button");
  btn.className = "btn primary small"; btn.style.marginTop = "8px"; btn.style.width = "100%";
  btn.textContent = "Send magic link";
  wrap.appendChild(btn);
  ctxMenu.appendChild(wrap);
  input.addEventListener("keydown", ev=> ev.stopPropagation());
  input.addEventListener("pointerdown", ev=> ev.stopPropagation());
  input.addEventListener("click", ev=> ev.stopPropagation());
  btn.addEventListener("pointerdown", ev=> ev.stopPropagation());
  btn.onclick = async (ev)=>{
    ev.stopPropagation();
    const email = input.value.trim();
    if(!email || !email.includes("@")) return toast("Enter a valid email");
    btn.textContent = "Sending...";
    try{
      const { error } = await supa.auth.signInWithOtp({
        email, options:{ emailRedirectTo: window.location.origin + window.location.pathname }
      });
      if(error) throw error;
      hideContextMenu();
      toast("Check your email for the sign-in link");
    }catch(err){ toast("Couldn't send the link — check your Supabase setup"); btn.textContent = "Send magic link"; }
  };
  placeContextMenu(r.left, r.bottom+6);
};
document.getElementById("btnMore").onclick = (e)=>{
  e.stopPropagation();
  const r = e.currentTarget.getBoundingClientRect();
  ctxMenu.innerHTML = "";
  ctxMenu.appendChild(ctxItem("⬇","Export JSON", exportJSON));
  ctxMenu.appendChild(ctxItem("⬆","Import JSON", ()=> document.getElementById("importFile").click()));
  ctxMenu.appendChild(ctxItem("🖨","Print map", ()=> window.print()));
  ctxMenu.appendChild(ctxSep());
  ctxMenu.appendChild(ctxItem("⚠","Reset this board...", showResetConfirm, true));
  placeContextMenu(r.left, r.bottom+6);
};
function showResetConfirm(){
  ctxMenu.innerHTML = "";
  ctxMenu.appendChild(ctxLabel("This clears all cards on \u201c" + activeBoard().name + "\u201d — export first if you want a backup."));
  ctxMenu.appendChild(ctxSep());
  ctxMenu.appendChild(ctxItem("⚠","Yes, reset the canvas", ()=>{
    pushHistory();
    activeBoard().nodes = [seedNode("central","MY PERSONALITY",null,"central","indigo",0,0,"")];
    nodesArr()[0].example=false;
    selectedId=null; renderAll(); scheduleSave(); toast("Canvas reset");
  }, true));
  ctxMenu.appendChild(ctxItem("←","Cancel", hideContextMenu));
  ctxMenu.classList.remove("hidden");
}
document.getElementById("importFile").onchange = (e)=>{
  if(e.target.files[0]) importJSON(e.target.files[0]);
  e.target.value = "";
};

/* ============================================================
   TOAST
   ============================================================ */
let toastTimer=null;
function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> t.classList.remove("show"), 2200);
}

/* ============================================================
   INIT
   ============================================================ */
function init(){
  state = loadState();
  centerViewportIfNeeded();
  applyTheme();
  applyStyle();
  renderAll();
  renderBoardsLabel();
  initCloud();
  registerServiceWorker();
  window.addEventListener("resize", ()=>applyTransform());
}
function registerServiceWorker(){
  // Only meaningful once deployed (e.g. on Vercel) alongside service-worker.js;
  // harmless no-op inside a preview where that file doesn't exist.
  if(!("serviceWorker" in navigator)) return;
  window.addEventListener("load", ()=>{
    navigator.serviceWorker.register("service-worker.js").catch(()=>{});
  });
}
init();

})();
